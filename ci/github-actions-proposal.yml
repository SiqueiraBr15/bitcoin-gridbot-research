name: Offline representative checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  representative:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 at preparation
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 at preparation
        with:
          python-version: '3.13'
      - name: Install pinned runtime and verification dependencies
        run: >-
          python -m pip install -c constraints.txt
          pydantic==2.13.5 pydantic-settings==2.15.0 python-dotenv==1.2.4
          pytest==9.1.1 hypothesis==6.168.5
          ruff==0.16.10 mypy==2.4.0
      - name: Ruff
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Representative suite (not the full coverage gate)
        run: python -m pytest -q @ci/smoke-suite.txt
      - name: Synthetic geometry
        run: python -m examples.offline_grid
